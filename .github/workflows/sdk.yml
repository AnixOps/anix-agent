name: SDK Quality

on:
  push:
    branches: [master, dev_new]
    tags: ["sdk/v*"]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    branches: [master, dev_new]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - uses: arduino/setup-protoc@v3
        with:
          version: "29.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: bufbuild/buf-action@v1
        with:
          version: "1.71.0"
          setup_only: true

      - name: Install pinned Go generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify SDK
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(go env GOPATH)/bin"
          export PATH="${go_bin}:${PATH}"
          bash sdk/api/grpc/gen.sh
          (
            cd sdk
            GOWORK=off go mod tidy
            bash scripts/check-breaking_test.sh
          )
          git diff --exit-code -- sdk/go.mod sdk/go.sum sdk/api/grpc/agent/v1
          test -z "$(git ls-files --others --exclude-standard -- sdk/api/grpc/agent/v1)"
          (
            cd sdk
            GOWORK=off go test ./... -count=1
            bash scripts/check-breaking.sh
          )
