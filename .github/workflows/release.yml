name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress; every other run
# (main, tags, manual runs) is its own group and finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The official AnixOps release key (base64 of the raw Ed25519 public key).
  ANIXOPS_OFFICIAL_PUBLIC_KEY: 'jW26nr2tbthASoeq6RmIpx8Ah+uhPNIv9V1ewRVb1VE='

jobs:
  tag-gate:
    name: validate release tag
    runs-on: ubuntu-24.04
    outputs:
      is_release_tag: ${{ steps.gate.outputs.is_release_tag }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Classify the ref
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          release=false
          if [[ "${EVENT}" == push || "${EVENT}" == workflow_dispatch ]] && [[ "${GITHUB_REF_TYPE}" == tag ]] &&
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            release=true
          fi
          echo "is_release_tag=${release}" >>"$GITHUB_OUTPUT"
          echo "release tag: ${release}"

      - name: Check the tag against the version surfaces
        if: steps.gate.outputs.is_release_tag == 'true'
        run: python3 scripts/check_release_version.py --tag "$GITHUB_REF_NAME"

  test:
    name: release prerequisite tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Release script self-tests
        run: |
          python3 scripts/check_release_version.py --self-test
          python3 scripts/check_release_assets.py --self-test
          python3 scripts/check_release_assets.py workflow --file .github/workflows/release.yml

      - name: Set up Go
        if: github.ref_type == 'tag'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: Set up protoc
        if: github.ref_type == 'tag'
        uses: arduino/setup-protoc@v3
        with:
          version: '29.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Proto codegen check
        if: github.ref_type == 'tag'
        run: |
          set -Eeuo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          export PATH="$(go env GOPATH)/bin:${PATH}"
          bash api/anxmgmt/gen.sh
          git diff --exit-code -- api/anxmgmt
          test -z "$(git ls-files --others --exclude-standard -- api/anxmgmt)"

      - name: Go tests
        if: github.ref_type == 'tag'
        run: |
          set -Eeuo pipefail
          go mod download
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::Go files are not gofmt-formatted"
            echo "${unformatted}"
            exit 1
          fi
          GOEXPERIMENT=jsonv2 GOWORK=off go test ./... -count=1

  build:
    name: build (${{ matrix.asset }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, asset: linux-64 }
          - { goos: linux, goarch: arm64, asset: linux-arm64-v8a }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      ASSET: anix-agent-${{ matrix.asset }}.zip
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Enforce release build policy
        run: bash scripts/check_release_build_policy.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -tags anixcore -trimpath -buildvcs=false -o build_assets/anix-agent \
            -ldflags "-X 'github.com/AnixOps/anix-agent/v5/cmd.version=${VERSION}' -s -w -buildid=" .
          cp README.md LICENSE example/*.json build_assets/

      - name: Package
        run: |
          set -Eeuo pipefail
          find build_assets -exec touch -d "$(date -u +%Y)-01-01T00:00:00Z" {} +
          (cd build_assets && zip -9qrX "../${ASSET}" .)
          for algo in md5 sha1 sha256 sha512; do
            printf '%s= %s\n' "${algo^^}" "$("${algo}sum" "${ASSET}" | cut -d' ' -f1)"
          done >"${ASSET}.dgst"
          cat "${ASSET}.dgst"
          python3 scripts/check_release_assets.py zip --zip "${ASSET}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.asset }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.dgst
          retention-days: 3

  release:
    name: release
    if: needs.tag-gate.outputs.is_release_tag == 'true'
    needs: [build, tag-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Sign the packages and SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY }}
        working-directory: dist
        run: |
          set -Eeuo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY is empty; see docs/INSTALL.md, Release Signing"; exit 1; }
          [[ "${PUBLIC_KEY}" == "${ANIXOPS_OFFICIAL_PUBLIC_KEY}" ]] || { echo "::error::ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY differs from ANIXOPS_OFFICIAL_PUBLIC_KEY in release.yml"; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          key_file="${work}/key.pem"
          (umask 077; printf '%s\n' "${SIGNING_KEY}" >"${key_file}")
          chmod 0600 "${key_file}"
          unset SIGNING_KEY
          # DER SubjectPublicKeyInfo of the raw Ed25519 key.
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "${ANIXOPS_OFFICIAL_PUBLIC_KEY}" | base64 -d; } >"${work}/official.der"
          packages=(anix-agent-linux-64.zip anix-agent-linux-arm64-v8a.zip)
          sha256sum "${packages[@]}" >SHA256SUMS
          for file in "${packages[@]}" SHA256SUMS; do
            openssl pkeyutl -sign -inkey "${key_file}" -rawin -in "${file}" -out "${work}/sig.bin"
            openssl pkeyutl -verify -pubin -keyform DER -inkey "${work}/official.der" -rawin \
              -in "${file}" -sigfile "${work}/sig.bin" >/dev/null
            base64 -w0 "${work}/sig.bin" >"${file}.sig"
            echo >>"${file}.sig"
          done

      - name: List release files
        run: ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/anix-agent-linux-64.zip
            dist/anix-agent-linux-64.zip.dgst
            dist/anix-agent-linux-64.zip.sig
            dist/anix-agent-linux-arm64-v8a.zip
            dist/anix-agent-linux-arm64-v8a.zip.dgst
            dist/anix-agent-linux-arm64-v8a.zip.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
