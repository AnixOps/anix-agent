name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [master, dev_new]
    tags: ["v*"]
  pull_request:
    branches: [master, dev_new]

permissions:
  contents: read

jobs:
  tag-gate:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.check.outputs.is_release_tag }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Check release or prerelease tag
        id: check
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            echo "Release tag accepted: ${GITHUB_REF_NAME}"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "Not a release or release-candidate tag; release publication will be skipped."
          fi

      - name: Verify release tag matches source versions
        if: steps.check.outputs.is_release_tag == 'true'
        run: python3 scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"

  test:
    name: release prerequisite tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Test release version gate
        run: python3 scripts/check_release_version.py --self-test

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check protobuf generated code
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          bash api/grpc/gen.sh
          git diff --exit-code -- api/grpc/v2boardpb
          test -z "$(git ls-files --others --exclude-standard -- api/grpc/v2boardpb)"

      - name: Download dependencies
        run: go mod download

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          test -z "${unformatted}" || { echo "${unformatted}"; exit 1; }

      - name: Run full Go test suite
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test ./... -count=1

      - name: Verify WireGuard contract
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test ./core/wireguard ./node -count=1

  build:
    name: build (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: linux-64
          - goos: linux
            goarch: arm64
            asset_name: linux-arm64-v8a

    runs-on: ubuntu-latest
    needs: test
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Enforce release build policy
        run: bash scripts/check_release_build_policy.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Get project dependencies
        run: go mod download

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "version=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Build AnixOps Agent
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/anix-agent -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/AnixOps/anix-agent/v4/cmd.version=$version' -s -w -buildid="
          ln -s anix-agent build_assets/V2bX

      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/example/*.json ./build_assets/
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo "Downloading ${DOWNLOAD_URL}..."
            curl -L "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done

      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          touch -h -mt $(date +%Y01010000) V2bX
          zip -9vyr ../anix-agent-${{ matrix.asset_name }}.zip .
          popd || exit 1
          FILE=./anix-agent-${{ matrix.asset_name }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.asset_name }}
          path: |
            ./anix-agent-${{ matrix.asset_name }}.zip
            ./anix-agent-${{ matrix.asset_name }}.zip.dgst

  wireguard-relay-integration:
    name: privileged WireGuard relay acceptance (${{ matrix.tunnel_type }})
    runs-on: ubuntu-latest
    needs: [test, tag-gate]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.tag-gate.outputs.is_release_tag == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        tunnel_type: [quic, wss]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Install privileged network dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables wireguard-tools curl openssl python3
          sudo modprobe wireguard || true
          test -c /dev/net/tun

      - name: Install pinned GOST v3
        run: |
          readonly gost_archive="$RUNNER_TEMP/gost_3.2.6_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$gost_archive" \
            https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz
          echo "b39037b0380ea001fb3c0c28441c2e10bfc694f90682739a65b53e55dce5238b  $gost_archive" | sha256sum --check --strict
          tar -xzf "$gost_archive" -C "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/gost"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gost" -V

      - name: Build WireGuard relay integration runner
        run: |
          GOEXPERIMENT=jsonv2 GOWORK=off go build -o wireguard-relay-integration ./cmd/wireguard-relay-integration

      - name: Verify real WireGuard to GOST relay path
        run: |
          sudo env \
            V2BX_WIREGUARD_INTEGRATION_BIN="${GITHUB_WORKSPACE}/wireguard-relay-integration" \
            GOST_BIN="${RUNNER_TEMP}/gost" \
            WIREGUARD_RELAY_TUNNEL_TYPE="${{ matrix.tunnel_type }}" \
            WIREGUARD_INTEGRATION_LOG_DIR="${GITHUB_WORKSPACE}/wireguard-integration-artifacts" \
            PATH="${PATH}:${RUNNER_TEMP}" \
            bash scripts/wireguard_relay_integration.sh

      - name: Upload WireGuard relay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-relay-integration-${{ matrix.tunnel_type }}-${{ github.run_id }}
          path: wireguard-integration-artifacts
          if-no-files-found: warn

  nftables-forward-integration:
    name: privileged nftables Forward acceptance
    runs-on: ubuntu-latest
    needs: [test, tag-gate]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.tag-gate.outputs.is_release_tag == 'true' }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Install privileged network dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables curl python3

      - name: Build nftables Forward plugin
        run: |
          GOEXPERIMENT=jsonv2 GOWORK=off go build -o nftables-forward ./cmd/nftables-forward

      - name: Verify real TCP and UDP nftables forwarding
        run: |
          mkdir -p nftables-forward-integration-artifacts
          sudo bash plugin/nftablesforward/namespace_acceptance.sh \
            --agent-binary "${GITHUB_WORKSPACE}/nftables-forward" \
            | tee nftables-forward-integration-artifacts/summary.txt

      - name: Upload nftables Forward diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nftables-forward-integration-${{ github.run_id }}
          path: nftables-forward-integration-artifacts
          if-no-files-found: warn

  forward-component-integration:
    name: privileged nftables Forward component acceptance (F3b)
    runs-on: ubuntu-latest
    needs: [test, tag-gate]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.tag-gate.outputs.is_release_tag == 'true' }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Install privileged network dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables

      - name: Build the forward component tests
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test -c -o forward.test ./forward

      - name: Apply a snapshot from the fake Control in throwaway namespaces and pass traffic
        run: sudo ANIXOPS_FORWARD_E2E=1 ./forward.test -test.run 'TestNetns' -test.v -test.count=1

  nat-egress-integration:
    name: privileged NAT egress acceptance
    runs-on: ubuntu-latest
    needs: [test, tag-gate]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.tag-gate.outputs.is_release_tag == 'true' }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Install privileged network dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables procps python3

      - name: Build NAT egress plugin
        run: |
          GOEXPERIMENT=jsonv2 GOWORK=off go build -o nat-egress ./cmd/nat-egress

      - name: Verify IPv4 masquerade and fwmark policy routing
        run: |
          mkdir -p nat-egress-integration-artifacts
          sudo bash plugin/nategress/namespace_acceptance.sh \
            --agent-binary "${GITHUB_WORKSPACE}/nat-egress" \
            2>&1 | tee nat-egress-integration-artifacts/summary.txt

      - name: Upload NAT egress diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nat-egress-integration-${{ github.run_id }}
          path: nat-egress-integration-artifacts
          if-no-files-found: warn

  gost-mesh-integration:
    name: privileged GOST Mesh acceptance (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, tag-gate]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.tag-gate.outputs.is_release_tag == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        transport: [quic, wss]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Install privileged network dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables curl openssl python3 procps
          test -c /dev/net/tun

      - name: Install pinned GOST v3.2.6
        shell: bash
        run: |
          readonly gost_archive="$RUNNER_TEMP/gost_3.2.6_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$gost_archive" \
            https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz
          echo "b39037b0380ea001fb3c0c28441c2e10bfc694f90682739a65b53e55dce5238b  $gost_archive" | sha256sum --check --strict
          tar -xzf "$gost_archive" -C "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/gost"
          echo "a2aea24efb4597b5f57b35b8e1bbcc59f439b80723854d4371f6828b46682ffb  $RUNNER_TEMP/gost" | sha256sum --check --strict
          "$RUNNER_TEMP/gost" -V

      - name: Build GOST Mesh plugin
        run: |
          GOEXPERIMENT=jsonv2 GOWORK=off go build -trimpath -o gost-mesh ./cmd/gost-mesh

      - name: Verify mTLS TCP, UDP, health, and cleanup
        run: |
          sudo env \
            GOST_MESH_PLUGIN_BIN="${GITHUB_WORKSPACE}/gost-mesh" \
            GOST_BIN="${RUNNER_TEMP}/gost" \
            GOST_MESH_TRANSPORT="${{ matrix.transport }}" \
            GOST_MESH_LOG_DIR="${GITHUB_WORKSPACE}/gost-mesh-integration-artifacts" \
            PATH="${PATH}:${RUNNER_TEMP}" \
            bash plugin/gostmesh/namespace_acceptance.sh

      - name: Upload GOST Mesh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gost-mesh-integration-${{ matrix.transport }}-${{ github.run_id }}
          path: gost-mesh-integration-artifacts
          if-no-files-found: warn

  release:
    if: needs.tag-gate.outputs.is_release_tag == 'true'
    needs: [build, tag-gate, wireguard-relay-integration, nftables-forward-integration, forward-component-integration, nat-egress-integration, gost-mesh-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Show release files
        run: ls -lh dist

      - name: Create/Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/anix-agent-linux-64.zip
            dist/anix-agent-linux-64.zip.dgst
            dist/anix-agent-linux-arm64-v8a.zip
            dist/anix-agent-linux-arm64-v8a.zip.dgst
