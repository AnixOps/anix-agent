name: CI

on:
  push:
    branches: [main, "maintenance/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly: a new Go advisory against main shows up without waiting for an
    # unrelated pull request.
    - cron: "41 2 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ["."]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: "off"
        run: govulncheck ./...

  test:
    name: go test + proto check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Validate release build policy script syntax
        run: bash -n scripts/check_release_build_policy.sh

      - name: Run release build policy self-test
        run: bash scripts/check_release_build_policy.sh --self-test

      - name: Validate release installer syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/anix-agent.sh
          bash -n scripts/V2bX.sh
          bash -n scripts/test_install_migration.sh
          bash -n scripts/test_manager_uninstall.sh
          bash scripts/install.sh --help >/dev/null
          bash scripts/anix-agent.sh --help >/dev/null
          bash scripts/V2bX.sh --help >/dev/null

      - name: Enforce release build policy
        run: bash scripts/check_release_build_policy.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::Go files are not gofmt-formatted"
            echo "${unformatted}"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Test installer migration and generated production config
        run: bash scripts/test_install_migration.sh

      - name: Test the manager script uninstall (temporary root, fake systemctl)
        run: bash scripts/test_manager_uninstall.sh

      - name: Run full Go test suite
        # Make CI robust if a go.work exists in the runner environment.
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test ./... -count=1

      - name: Verify durable maintenance transport and restart policy under race detector
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test -race ./common/maintenance ./plugin -run 'Test(Maintenance|Outbox|Qualification|Consecutive|ManualErrors|EventRejects|Corrupt|InstanceState)' -count=1

      - name: Run the node package under race detector
        # The control-stream data plane applies configuration, users and the
        # alive list on its own goroutine while the node starts; a race
        # between them (aliveMap) only showed in tests outside the filter above.
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test -race ./node -count=1

      - name: Verify WireGuard relay and peer limit contract
        run: GOEXPERIMENT=jsonv2 GOWORK=off go test ./core/wireguard ./node -count=1


      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Proto codegen check
        shell: bash
        run: |
          bash api/anxmgmt/gen.sh
          git diff --exit-code -- api/anxmgmt
          test -z "$(git ls-files --others --exclude-standard -- api/anxmgmt)"
