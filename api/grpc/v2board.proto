syntax = "proto3";

package v2board;

option go_package = "github.com/AnixOps/anix-agent/v5/api/grpc/v2boardpb";

// ==================== 閫氱敤娑堟伅 ====================

// 绌哄搷搴?
message Empty {}

// 鐘舵€佸搷搴?
message StatusResponse {
  bool success = 1;
  string message = 2;
  int32 code = 3;
}

// ==================== 鑺傜偣鏈嶅姟 ====================

// 鑺傜偣娉ㄥ唽璇锋眰
message NodeRegisterRequest {
  string auth_key = 1;           // 鎺堟潈瀵嗛挜
  string name = 2;               // 鑺傜偣鍚嶇О
  string host = 3;               // 鑺傜偣鍦板潃
  int32 port = 4;                // API绔彛
  string server_version = 5;     // 鑺傜偣鐗堟湰
  string server_os = 6;          // 鎿嶄綔绯荤粺
  repeated string supported_protocols = 7; // 鏀寔鐨勫崗璁垪琛?
}

// 鑺傜偣娉ㄥ唽鍝嶅簲
message NodeRegisterResponse {
  uint32 node_id = 1;            // 鑺傜偣ID
  string api_key = 2;            // API瀵嗛挜
  string secret = 3;             // 鍏变韩瀵嗛挜
  string message = 4;
}

// 鑺傜偣閰嶇疆璇锋眰
message NodeConfigRequest {
  uint32 node_id = 1;
}

// 鑺傜偣閰嶇疆鍝嶅簲
message NodeConfigResponse {
  string node_type = 1;
  string type = 2;               // 涓?node_type 涓€鑷?
  string host = 3;
  int32 server_port = 4;
  string server_name = 5;
  int32 tls = 6;                 // 0=鏃? 1=TLS, 2=Reality
  map<string, string> tls_settings = 7;
  string network = 8;            // tcp, ws, grpc, etc.
  map<string, string> network_settings = 9;
  string cipher = 10;            // SS鍔犲瘑鏂瑰紡
  string flow = 11;              // VLESS flow
  string server_key = 12;        // SS2022鏈嶅姟鍣ㄥ瘑閽?
  BaseConfig base_config = 13;
  repeated Route routes = 14;
  string send_through = 15;
  map<string, string> extra = 16; // 鎵╁睍閰嶇疆
}

// 鍩虹閰嶇疆
message BaseConfig {
  int32 push_interval = 1;       // 娴侀噺涓婃姤闂撮殧(绉?
  int32 pull_interval = 2;       // 閰嶇疆鎷夊彇闂撮殧(绉?
}

// 璺敱閰嶇疆
message Route {
  string match = 1;
  string action = 2;
}

// 鑺傜偣鐘舵€佷笂鎶ヨ姹?
message NodeStatusRequest {
  uint32 node_id = 1;
  double cpu_usage = 2;
  double memory_usage = 3;
  double disk_usage = 4;
  int64 uptime = 5;
  int32 online_users = 6;
  int64 upload = 7;              // 鏈涓婃姤鐨勪笂浼犳祦閲忓閲?
  int64 download = 8;            // 鏈涓婃姤鐨勪笅杞芥祦閲忓閲?
}

message NodeLogEntry {
  string level = 1;
  string source = 2;
  string message = 3;
  int64 timestamp = 4;
  string fields_json = 5;
  string trace_id = 6;
}

message NodeLogBatchRequest {
  uint32 node_id = 1;
  repeated NodeLogEntry logs = 2;
}

// 鑺傜偣鏈嶅姟
service NodeService {
  // 鑺傜偣娉ㄥ唽
  rpc Register(NodeRegisterRequest) returns (NodeRegisterResponse);

  // 鑾峰彇鑺傜偣閰嶇疆
  rpc GetConfig(NodeConfigRequest) returns (NodeConfigResponse);

  // 涓婃姤鑺傜偣鐘舵€?(鏇夸唬蹇冭烦)
  rpc ReportStatus(NodeStatusRequest) returns (StatusResponse);

  // 鍙屽悜娴侊細鑺傜偣鐘舵€佸疄鏃堕€氫俊
  rpc StatusStream(stream NodeStatusRequest) returns (stream NodeConfigResponse);
}

service NodeLogService {
  rpc ReportLogs(NodeLogBatchRequest) returns (StatusResponse);
}

// ==================== 鐢ㄦ埛鏈嶅姟 ====================

// 鐢ㄦ埛鍒楄〃璇锋眰
message UserListRequest {
  uint32 node_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 鐢ㄦ埛淇℃伅
message UserInfo {
  uint32 id = 1;
  string uuid = 2;
  int64 speed_limit = 3;         // 閫熷害闄愬埗 (bytes/s)
  int32 device_limit = 4;        // 璁惧闄愬埗
  int64 expired_at = 5;          // 杩囨湡鏃堕棿
  int64 transfer_enable = 6;     // 鎬绘祦閲?
  int64 used_upload = 7;         // 宸茬敤涓婁紶
  int64 used_download = 8;       // 宸茬敤涓嬭浇
  map<string, string> extra = 9; // 鎵╁睍淇℃伅
}

// 鐢ㄦ埛鍒楄〃鍝嶅簲
message UserListResponse {
  repeated UserInfo users = 1;
  int64 total = 2;
  int64 updated_at = 3;          // 鏁版嵁鏇存柊鏃堕棿
}

// 鐢ㄦ埛鍙樻洿閫氱煡
message UserChangeNotification {
  enum ChangeType {
    UNKNOWN = 0;
    CREATED = 1;
    UPDATED = 2;
    DELETED = 3;
    TRAFFIC_RESET = 4;
    BANNED = 5;
    UNBANNED = 6;
  }
  ChangeType type = 1;
  UserInfo user = 2;
  int64 timestamp = 3;
}

// 鐢ㄦ埛鏈嶅姟
service UserService {
  // 鑾峰彇鐢ㄦ埛鍒楄〃
  rpc GetUsers(UserListRequest) returns (UserListResponse);

  // 鍙屽悜娴侊細鐢ㄦ埛鍙樻洿瀹炴椂鎺ㄩ€?
  // 闈㈡澘鎺ㄩ€佺敤鎴峰彉鏇达紝鑺傜偣纭鎺ユ敹
  rpc UserChanges(stream UserChangeNotification) returns (stream StatusResponse);
}

// ==================== 娴侀噺鏈嶅姟 ====================

// 娴侀噺涓婃姤璇锋眰
message TrafficReportRequest {
  uint32 node_id = 1;
  map<uint32, TrafficData> traffics = 2;  // 鐢ㄦ埛ID -> 娴侀噺鏁版嵁
}

// 娴侀噺鏁版嵁
message TrafficData {
  int64 upload = 1;              // 涓婁紶娴侀噺 (bytes)
  int64 download = 2;            // 涓嬭浇娴侀噺 (bytes)
}

// 娴侀噺涓婃姤鍝嶅簲
message TrafficReportResponse {
  bool success = 1;
  string message = 2;
  map<uint32, int64> balances = 3;  // 鐢ㄦ埛ID -> 鏇存柊鍚庣殑浣欓(鍙€?
}

// 鍦ㄧ嚎鐘舵€佷笂鎶ヨ姹?
message OnlineReportRequest {
  uint32 node_id = 1;
  map<uint32, OnlineData> online = 2;   // 鐢ㄦ埛ID -> 鍦ㄧ嚎鏁版嵁
}

// 鍦ㄧ嚎鏁版嵁
message OnlineData {
  repeated string ips = 1;       // 鍦ㄧ嚎IP鍒楄〃
  int64 timestamp = 2;           // 鏃堕棿鎴?
}

// 娴侀噺鏈嶅姟
service TrafficService {
  // 鎵归噺涓婃姤娴侀噺
  rpc ReportTraffic(TrafficReportRequest) returns (TrafficReportResponse);

  // 涓婃姤鍦ㄧ嚎鐘舵€?
  rpc ReportOnline(OnlineReportRequest) returns (StatusResponse);

  // 鍙屽悜娴侊細瀹炴椂娴侀噺涓婃姤
  // 鑺傜偣鎸佺画涓婃姤锛岄潰鏉垮疄鏃跺搷搴?
  rpc TrafficStream(stream TrafficReportRequest) returns (stream TrafficReportResponse);

  // 鍙屽悜娴侊細瀹炴椂鍦ㄧ嚎鐘舵€?
  rpc OnlineStream(stream OnlineReportRequest) returns (stream StatusResponse);
}

// ==================== 閰嶇疆鍚屾鏈嶅姟 ====================

// 閰嶇疆鍚屾璇锋眰
message ConfigSyncRequest {
  uint32 node_id = 1;
  int64 last_sync_time = 2;      // 涓婃鍚屾鏃堕棿
}

// 閰嶇疆鍚屾鍝嶅簲
message ConfigSyncResponse {
  bool has_changes = 1;
  NodeConfigResponse config = 2; // 濡傛灉鏈夊彉鏇?
  repeated UserInfo users = 3;   // 鐢ㄦ埛鍒楄〃(鍏ㄩ噺鎴栧閲?
  int64 sync_time = 4;           // 褰撳墠鍚屾鏃堕棿
}

// 閰嶇疆鍙樻洿閫氱煡
message ConfigChangeNotification {
  enum ChangeType {
    UNKNOWN = 0;
    NODE_CONFIG = 1;             // 鑺傜偣閰嶇疆鍙樻洿
    USER_LIST = 2;               // 鐢ㄦ埛鍒楄〃鍙樻洿
    PROTOCOL_CONFIG = 3;         // 鍗忚閰嶇疆鍙樻洿
  }
  ChangeType type = 1;
  uint32 node_id = 2;
  int64 timestamp = 3;
  bytes payload = 4;             // 鍙樻洿鍐呭(JSON)
}

// 閰嶇疆鍚屾鏈嶅姟
service ConfigSyncService {
  // 璇锋眰閰嶇疆鍚屾
  rpc SyncConfig(ConfigSyncRequest) returns (ConfigSyncResponse);

  // 鍙屽悜娴侊細閰嶇疆鍙樻洿瀹炴椂鎺ㄩ€?
  // 闈㈡澘鎺ㄩ€佸彉鏇达紝鑺傜偣纭鎺ユ敹
  rpc ConfigChanges(stream ConfigChangeNotification) returns (stream StatusResponse);

  // 鍏ㄩ噺鍚屾 (鑺傜偣鍚姩鏃?
  rpc FullSync(ConfigSyncRequest) returns (ConfigSyncResponse);
}

// ==================== 鍋ュ悍妫€鏌ユ湇鍔?====================

// 鍋ュ悍妫€鏌ヨ姹?
message HealthCheckRequest {
  uint32 node_id = 1;
  string version = 2;
}

// 鍋ュ悍妫€鏌ュ搷搴?
message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string server_version = 2;
  int64 timestamp = 3;
}

// 鍋ュ悍妫€鏌ユ湇鍔?
service HealthService {
  // 绠€鍗曞仴搴锋鏌?
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // 鍙屽悜娴侊細鎸佺画鍋ュ悍妫€鏌?
  rpc Watch(stream HealthCheckRequest) returns (stream HealthCheckResponse);
}
